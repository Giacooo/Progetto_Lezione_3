# DOCKER COMPOSE: dice a Docker come avviare l'assistente.
# Dallo step 6 della lezione 6 i servizi sono DUE, costruiti dalla stessa immagine (Dockerfile):
#   - agente: il servizio HTTP dell'agente (grafo, modello, server MCP) su http://localhost:8000;
#   - cli:    la chat nel terminale, che parla con l'agente solo attraverso la sua API.
# Dallo step 7 c'è anche il servizio db: PostgreSQL, dove il back-end salva chat e messaggi
# (il back-end, per ora, gira sul PC con "python -m backend").
# Si usa così (dalla cartella del progetto):
#   docker compose up -d db                 (avvia PostgreSQL in background)
#   docker compose up -d --build agente     (avvia l'agente in background)
#   docker compose run --rm cli             (apre la chat; esci con "esci")
#   docker compose down                     (ferma i servizi; i dati di PostgreSQL restano nel volume)
# ATTENZIONE: "docker compose down -v" cancella anche il volume, cioè tutte le chat salvate.
# ("agente", "cli" e "db" sono i nomi dei servizi scritti qui sotto.)
services:
  agente:
    # Costruisce l'immagine usando il Dockerfile della cartella corrente (il punto).
    build: .
    # Il Dockerfile avvia la CLI; questo servizio invece avvia il servizio HTTP dell'agente.
    command: ["python", "-m", "assistente.servizio"]
    # Carica le variabili dal file .env locale (non è copiato nell'immagine).
    env_file: .env
    environment:
      # Nel container localhost è il container stesso: LM Studio è sull'host.
      # Questa riga SOSTITUISCE il valore di LM_BASE_URL preso dal .env, perché le variabili
      # impostate qui hanno la precedenza. "host.docker.internal" significa "il PC su cui
      # gira Docker".
      LM_BASE_URL: http://host.docker.internal:1234/v1
      # Nel container il servizio deve ascoltare su tutte le interfacce (0.0.0.0): con il
      # predefinito 127.0.0.1 risponderebbe solo dall'interno del container stesso.
      AGENTE_HOST: 0.0.0.0
    # La porta 8000 del container è pubblicata sulla 8000 del PC: così /docs si apre dal browser
    # (http://localhost:8000/docs) e l'API si chiama anche da PowerShell.
    ports:
      - "8000:8000"
    # Fa in modo che il nome host.docker.internal funzioni anche su Linux.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Note (SQLite) e preferenze stanno in ./archivio sul PC: sopravvivono ai container.
    # Il server MCP stdio parte DENTRO questo container, e li legge da qui.
    volumes:
      - ./archivio:/app/archivio

  cli:
    # Stessa immagine, comando del Dockerfile: la chat nel terminale.
    build: .
    command: ["python", "-m", "assistente"]
    # Sessione interattiva: il terminale resta collegato al prompt Tu>
    # (stdin_open = la tastiera arriva al programma; tty = si comporta come un vero terminale).
    stdin_open: true
    tty: true
    # La CLI usa solo AGENTE_URL e LOG_LEVEL; le altre variabili del .env le ignora.
    env_file: .env
    environment:
      # Dentro la rete di Docker l'agente si raggiunge con il nome del suo servizio.
      AGENTE_URL: http://agente:8000
    # La CLI non serve a nulla senza l'agente: "run cli" lo avvia, se non è già acceso.
    # Nota: nessuna sezione "ports": la CLI non è un server, esce solo verso l'agente.
    depends_on:
      - agente

  db:
    # PostgreSQL con l'immagine ufficiale (lezione 6, step 7): qui il back-end salva le chat.
    # La versione 17 è fissata: la 18 cambia la cartella dei dati dentro il volume.
    image: postgres:17.12-alpine
    # Utente, password e nome del database arrivano dal file .env (Docker Compose sostituisce
    # ${...} con i valori del .env). Le stesse variabili le legge il back-end: le credenziali
    # stanno scritte una volta sola, e mai in questo file.
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    # La porta 5432 è pubblicata solo su 127.0.0.1: il database si raggiunge da questo PC
    # (serve al back-end avviato con "python -m backend"), non dagli altri computer della rete.
    ports:
      - "127.0.0.1:5432:5432"
    # I dati stanno in un volume di Docker: restano anche se il container viene fermato,
    # ricreato o aggiornato. Così le chat sopravvivono al riavvio.
    volumes:
      - dati-postgres:/var/lib/postgresql/data

# I volumi "con nome" gestiti da Docker (si vedono con: docker volume ls).
volumes:
  dati-postgres:
