# CONFIGURAZIONE DI PYTEST (il programma che esegue i test con: python -m pytest)
[pytest]
# I test si trovano nella cartella "tests".
testpaths = tests
# Aggiunge la cartella del progetto ai percorsi di import, così i test trovano "assistente".
pythonpath = .
# Registra l'etichetta "reale", usata dalle prove col modello vero (così pytest non protesta).
markers =
    reale: prova con LM Studio attivo (richiede PROVE_REALI=1)
